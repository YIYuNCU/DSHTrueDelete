name: publish

# 发布到 npm，让 `dsh plugin --profile desktop add dsh-true-delete` 这类按包名安装可用。
#
# 发布方式：npm 的 Trusted Publishing（OIDC 可信发布）—— 不使用任何 token 或 secret。
#   1. 在 https://www.npmjs.com/package/dsh-true-delete 的 Settings → Trusted Publisher
#      填入：GitHub Actions / YIYuNCU / DSHTrueDelete / publish.yml（environment 留空）
#   2. 仓库里不需要 NPM_TOKEN；如仍有该 secret，删掉即可
#   3. 打标签推送：git tag v0.2.1 && git push origin v0.2.1（或在 Actions 页面手动触发）
#      标签版本必须与 package.json 的 version 一致，否则工作流会在版本校验那一步停下。
#
# 为什么不再用 token：npm 正在限制「绕过 2FA 的 token」用于直接发布；这类 token 可能只把
# 包放进暂存区（包名会解析到 0.0.0-stage 这个 stub），必须再手动批准。OIDC 没有这个问题，
# 且会自动附带 provenance。若历史上留下过暂存条目，先清掉再发：
#   npx npm@11 stage list   →   npx npm@11 stage reject <stage-id>
#
# 说明：DSH 自带「插件与运行时版本」兼容检查，会读取本包 peerDependencies 里
#       @deepseek-ai/dsh 的范围；范围不匹配时宿主会拒绝加载，直到用户显式授予 exact-version 豁免。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Trusted Publishing 与 provenance 都依赖它

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不传 registry-url：那会在 .npmrc 里写一行 ${NODE_AUTH_TOKEN}，
      # 而明确设置 registry 就足够，凭据完全交给 OIDC。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 可信发布要求 npm >= 11.5.1，runner 自带的 10.x 会以 E404/E401 这类
      # 难懂的方式失败，所以这里先升级并断言版本。
      - name: Upgrade npm for Trusted Publishing
        run: |
          npm install -g npm@latest
          version=$(npm --version)
          echo "npm $version"
          node -e '
            const need = [11, 5, 1];
            const got = String(process.argv[1] || "0.0.0").split("-")[0].split(".").map(Number);
            let ok = false;
            for (let i = 0; i < need.length; i += 1) {
              if (got[i] > need[i]) { ok = true; break; }
              if (got[i] < need[i]) break;
              if (i === need.length - 1) ok = true;
            }
            if (!ok) {
              console.error(`::error title=npm 版本过低::可信发布需要 npm >= ${need.join(".")}，当前 ${process.argv[1]}`);
              process.exit(1);
            }
            console.log(`npm ${process.argv[1]} 满足 >= ${need.join(".")}`);
          ' "$version"

      - name: Configure registry and verify OIDC
        run: |
          npm config set registry https://registry.npmjs.org/
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::error title=没有 OIDC 凭据::工作流需要 permissions: id-token: write，且 npm 只在 GitHub Actions 里做可信发布。"
            exit 1
          fi
          echo "凭据：Trusted Publishing（OIDC，无 token）"

      # 标签版本必须与清单一致，否则 npm 会以难懂的方式拒绝
      - name: Check tag matches package version
        run: |
          node -e '
            const version = require("./package.json").version;
            const ref = process.env.GITHUB_REF_NAME || "";
            if (ref.startsWith("v") && ref.slice(1) !== version) {
              console.error(`::error title=版本不一致::标签 ${ref} 与 package.json 的 ${version} 不一致`);
              process.exit(1);
            }
            console.log(`version ${version} / ref ${ref || "(manual)"}`);
          '

      # 三套离线检查：文档/清单、宿主半边、页面半边
      # （页面套件在拿不到 app.asar 时会自动跳过依赖安装包的断言）
      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --access public --provenance
