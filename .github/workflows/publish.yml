name: publish

# 发布到 npm，让 `dsh plugin --profile desktop add dsh-true-delete` 这类按包名安装可用。
#
# 触发方式：
#   1. 打标签推送：git tag v0.2.0 && git push origin v0.2.0
#   2. 或在 Actions 页面手动 workflow_dispatch
#
# 凭据有两种，二选一，本工作流都支持：
#
#   A) 可信发布（Trusted Publishing，推荐）
#      在 https://www.npmjs.com/package/dsh-true-delete/access 配置 Trusted Publisher：
#      GitHub 仓库 YIYuNCU/DSHTrueDelete、workflow 文件名 publish.yml。
#      之后不需要任何 secret —— npm 用 OIDC 换取短时凭据，并自动附带 provenance。
#      npm 正在限制「绕过 2FA 的 token」用于直接发布，这是官方推荐方向。
#
#   B) NPM_TOKEN secret
#      在 GitHub 仓库 Settings → Secrets and variables → Actions 增加 NPM_TOKEN。
#      注意：npm 已开始限制 bypass-2FA token 的直接发布，这类 token 可能只把包放进
#      暂存区（包名会解析到 0.0.0-stage 这个 stub），需要再用 `npm stage approve` 批准。
#
# 说明：DSH 自带「插件与运行时版本」兼容检查，会读取本包 peerDependencies 里
#       @deepseek-ai/dsh 的范围；范围不匹配时宿主会拒绝加载，直到用户显式授予 exact-version 豁免。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / Trusted Publishing 都要它

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不用 setup-node 的 registry-url：它会写死一行 ${NODE_AUTH_TOKEN}，
      # 在走可信发布（没有该 secret）时反而可能干扰 OIDC 流程。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure registry and credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set registry https://registry.npmjs.org/
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
            echo "凭据：NPM_TOKEN（长度 ${#NODE_AUTH_TOKEN}）"
          elif [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "凭据：Trusted Publishing（OIDC，无 token）"
          else
            echo "::error title=缺少发布凭据::既没有 NPM_TOKEN secret，也没有 OIDC（id-token: write）。请配置可信发布，或添加 NPM_TOKEN。"
            exit 1
          fi

      # 标签版本必须与清单一致，否则 npm 会以难懂的方式拒绝
      - name: Check tag matches package version
        run: |
          node -e '
            const version = require("./package.json").version;
            const ref = process.env.GITHUB_REF_NAME || "";
            if (ref.startsWith("v") && ref.slice(1) !== version) {
              console.error(`::error title=版本不一致::标签 ${ref} 与 package.json 的 ${version} 不一致`);
              process.exit(1);
            }
            console.log(`version ${version} / ref ${ref || "(manual)"}`);
          '

      # 三套离线检查：文档/清单、宿主半边、页面半边
      # （页面套件在拿不到 app.asar 时会自动跳过依赖安装包的断言）
      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
