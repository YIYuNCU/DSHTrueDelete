# ============================================================================
# dsh-true-delete —— DSH bundle patch
# ============================================================================
# 这是插件的「挂载声明」：DSH 启动时按 bundle 层栈叠加各插件的 patch，
# 本文件把自己作为一条 Loader entry 插进当前 profile 的配置树。
